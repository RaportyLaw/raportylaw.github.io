<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Taryfikatora Kar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background-color: #262626;
            border-radius: 8px;
            border-bottom: 4px solid #e74c3c;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        header h1 {
            color: #ffffff;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            color: #aaa;
            margin-top: 5px;
            font-size: 14px;
        }

        /* Sekcja podsumowania (sticky panel) */
        .summary-box {
            position: sticky;
            top: 20px;
            background: #2e2e2e;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .summary-card {
            background: #222;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            border-left: 4px solid #555;
        }

        .summary-card.months { border-left-color: #3498db; }
        .summary-card.money { border-left-color: #2ecc71; }
        .summary-card.record { border-left-color: #e74c3c; }
        .summary-card.bail { border-left-color: #f1c40f; }

        .summary-card h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .summary-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .summary-card .value.yes { color: #e74c3c; }
        .summary-card .value.no { color: #2ecc71; }

        .btn-reset {
            grid-column: 1 / -1;
            background: #c0392b;
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .btn-reset:hover {
            background: #e74c3c;
        }

        /* Tabele kodeksów */
        .section-title {
            font-size: 18px;
            padding: 12px;
            margin-top: 30px;
            margin-bottom: 0;
            border-radius: 6px 6px 0 0;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            color: #fff;
        }

        .codeks-d { background-color: #d39e00; color: #000; } /* Kodeks Wykroczeń Drogowych */
        .codeks-w { background-color: #27ae60; } /* Kodeks Wykroczeń Innych */
        .codeks-wp { background-color: #2980b9; } /* Kodeks Występków */
        .codeks-bp { background-color: #d35400; } /* Kodeks Broni */
        .codeks-ns { background-color: #8e44ad; } /* Kodeks Substancji */
        .codeks-z { background-color: #c0392b; } /* Kodeks Zbrodni */

        .table-container {
            background: #262626;
            border-radius: 0 0 6px 6px;
            overflow-x: auto;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #3d3d3d;
            vertical-align: middle;
        }

        th {
            background-color: #1f1f1f;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }

        tr:hover {
            background-color: #2f2f2f;
        }

        tr.selected {
            background-color: #3a3a3a;
        }

        /* Checkboxy */
        .col-check { width: 40px; text-align: center; }
        .col-id { width: 60px; color: #888; font-weight: bold; }
        .col-crime { width: 40%; }
        .col-months { width: 90px; text-align: center; }
        .col-money { width: 110px; text-align: right; font-weight: bold; }
        .col-record { width: 100px; text-align: center; }
        .col-bail { width: 100px; text-align: center; }
        .col-info { color: #aaa; font-size: 13px; }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #e74c3c;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
        }

        .badge.yes { background-color: #27ae60; color: #fff; }
        .badge.no { background-color: #c0392b; color: #fff; }
        .badge.court { background-color: #d35400; color: #fff; }

        /* Wyszukiwarka */
        .search-box {
            width: 100%;
            padding: 12px 15px;
            background: #262626;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .search-box:focus {
            outline: 2px solid #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">

        </div>
        <div class="summary-card money">
            <h3>Suma Grzywny ($)</h3>
            <div class="value" id="total-money">$0</div>
        </div>
        <div class="summary-card record">
            <h3>Wpis do Kartoteki</h3>
            <div class="value no" id="total-record">NIE</div>
        </div>
        <div class="summary-card bail">

        </div>
        <button class="btn-reset" onclick="resetCalculator()">Wyczyść zaznaczenia</button>

    <input type="text" id="search" class="search-box" placeholder="Filtruj lub szukaj przestępstwa / wykroczenia..." oninput="filterCrimes()">

    <div id="calculator-content"></div>
</div>

// Generowanie tabel w HTML
function renderTables() {
    const container = document.getElementById('calculator-content');
    container.innerHTML = '';

    taryfikator.forEach((cat, catIdx) => {
        const title = document.createElement('h2');
        title.className = `section-title ${cat.class}`;
        title.innerText = cat.category;
        container.appendChild(title);

        const tableCont = document.createElement('div');
        tableCont.className = 'table-container';

        let tableHtml = `<table>
            <thead>
                <tr>
                    <th class="col-check"></th>
                    <th class="col-id">Kod</th>
                    <th class="col-crime">Przestępstwo / Wykroczenie</th>
                    <th class="col-months">Miesiące</th>
                    <th class="col-money">Grzywna</th>
                    <th class="col-record">Rejestr</th>
                    <th class="col-bail">Kaucja</th>
                    <th class="col-info">Dodatkowe informacje</th>
                </tr>
            </thead>
            <tbody>`;

        cat.items.forEach((item, itemIdx) => {
            const moneyText = item.money === 0 ? "Sąd / Prokuratura" : `$${item.money.toLocaleString()}`;
            tableHtml += `
                <tr id="row-${item.id}">
                    <td class="col-check">
                        <input type="checkbox" id="chk-${item.id}" data-cat="${catIdx}" data-item="${itemIdx}" onchange="calculateTotal('${item.id}')">
                    </td>
                    <td class="col-id">${item.id}</td>
                    <td class="col-crime" style="font-weight: 500;">${item.name}</td>
                    <td class="col-months">${item.months}</td>
                    <td class="col-money">${moneyText}</td>
                    <td class="col-record">
                        <span class="badge ${item.record ? 'yes' : 'no'}">${item.record ? 'TAK' : 'NIE'}</span>
                    </td>
                    <td class="col-bail">
                        <span class="badge ${item.bail ? 'yes' : 'no'}">${item.bail ? 'TAK' : 'NIE'}</span>
                    </td>
                    <td class="col-info">${item.info}</td>
                </tr>`;
        });

        tableHtml += `</tbody></table>`;
        tableCont.innerHTML = tableHtml;
        container.appendChild(tableCont);
    });
}

// Funkcja przeliczająca sumy
function calculateTotal(rowId) {
    // Efekt wizualny zaznaczenia wiersza
    const row = document.getElementById(`row-${rowId}`);
    const chk = document.getElementById(`chk-${rowId}`);
    if (chk.checked) {
        row.classList.add('selected');
    } else {
        row.classList.remove('selected');
    }

    let totalMonths = 0;
    let totalMoney = 0;
    let hasRecord = false;
    let canBail = true; // Domyślnie TAK, ale jeśli choć jedno zaznaczone ma kaucję NIE, to ogólnie NIE (lub zgodnie z logiką serwera)
    
    let anyChecked = false;

    taryfikator.forEach(cat => {
        cat.items.forEach(item => {
            const checkbox = document.getElementById(`chk-${item.id}`);
            if (checkbox && checkbox.checked) {
                anyChecked = true;
                totalMonths += item.months;
                totalMoney += item.money;
                if (item.record) hasRecord = true;
                if (!item.bail) canBail = false; // Jeśli jedno zabrania kaucji, kaucja przepada
            }
        });
    });

    // Aktualizacja widoku podsumowania
    document.getElementById('total-months').innerText = totalMonths;
    document.getElementById('total-money').innerText = `$${totalMoney.toLocaleString()}`;
    
    const recordEl = document.getElementById('total-record');
    if (hasRecord) {
        recordEl.innerText = "TAK";
        recordEl.className = "value yes";
    } else {
        recordEl.innerText = "NIE";
        recordEl.className = "value no";
    }

    const bailEl = document.getElementById('total-bail');
    if (!anyChecked) {
        bailEl.innerText = "TAK";
        bailEl.className = "value yes";
    } else if (canBail) {
        bailEl.innerText = "TAK";
        bailEl.className = "value yes";
    } else {
        bailEl.innerText = "NIE";
        bailEl.className = "value no";
    }
}

// Resetowanie kalkulatora
function resetCalculator() {
    taryfikator.forEach(cat => {
        cat.items.forEach(item => {
            const checkbox = document.getElementById(`chk-${item.id}`);
            if (checkbox) {
                checkbox.checked = false;
                document.getElementById(`row-${item.id}`).classList.remove('selected');
            }
        });
    });
    document.getElementById('total-months').innerText = "0";
    document.getElementById('total-money').innerText = "$0";
    document.getElementById('total-record').innerText = "NIE";
    document.getElementById('total-record').className = "value no";
    document.getElementById('total-bail').innerText = "TAK";
    document.getElementById('total-bail').className = "value yes";
}

// Filtrowanie/Wyszukiwanie
function filterCrimes() {
    const query = document.getElementById('search').value.toLowerCase();
    
    taryfikator.forEach(cat => {
        cat.items.forEach(item => {
            const row = document.getElementById(`row-${item.id}`);
            const text = (item.id + " " + item.name + " " + item.info).toLowerCase();
            if (text.includes(query)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }
        });
    });
}

// Inicjalizacja przy załadowaniu strony
renderTables();
